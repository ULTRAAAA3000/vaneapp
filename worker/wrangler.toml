# Cron worker: sends scheduled posts. Deployed SEPARATELY from the Pages site:
#   npm run cron:deploy      then      npm run cron:secret     (paste the SAME ENCRYPTION_KEY as Pages)
name = "vaneapp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false          # no public *.workers.dev URL: nothing can call this Worker over HTTP

[triggers]
crons = ["* * * * *"]        # every minute

[[d1_databases]]
binding = "DB"
database_name = "vane-db"
database_id = "9e560592-ec8e-451d-97d3-c2d8082c527e"

[vars]
APP_URL = "https://vaneapp.dev"
TURNSTILE_SITE_KEY = "0x4AAAAAAFYNiz-h1o5Y-W8u"# turns stored R2 keys into public image links

[observability]
enabled = true               # keep logs: Workers & Pages → this worker → Logs
