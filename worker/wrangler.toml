# Cron worker: sends scheduled posts. Deployed SEPARATELY from the Pages site:
#   npm run cron:deploy      then      npm run cron:secret     (paste the SAME ENCRYPTION_KEY as Pages)
name = "vaneapp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false          # no public *.workers.dev URL: nothing can call this Worker over HTTP

[triggers]
crons = ["* * * * *"]        # every minute

[[d1_databases]]
binding = "DB"
database_name = "vane-db"
database_id = "9e560592-ec8e-451d-97d3-c2d8082c527e"

[[r2_buckets]]
binding = "MEDIA"              # the video library: Vane Studio's publishers read the files from here
bucket_name = "vane-media"

[vars]
APP_URL = "https://vaneapp.dev"   # turns stored R2 keys into public image links

# YouTube (Vane Studio): the same YOUTUBE_CLIENT_ID (var) and YOUTUBE_CLIENT_SECRET (secret: `wrangler secret put YOUTUBE_CLIENT_SECRET`) as on the Pages project.
# Weekly Analytics email (optional): the same EMAIL_FROM (var), RESEND_API_KEY and JWT_SECRET (secrets) as on the Pages project; without them the cron simply skips the report.
# Payments (optional, same values as on the Pages project): CRYPTO_WALLET (a var), SOLANA_RPC_URL (a var) and MONOBANK_TOKEN (a secret: `wrangler secret put MONOBANK_TOKEN`).
# With them the cron also finds crypto payments after the buyer closed the checkout page. Without them payments are still found while the checkout page is open.

[observability]
enabled = true               # keep logs: Workers & Pages → this worker → Logs
