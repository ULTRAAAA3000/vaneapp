name = "vaneapp"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "vane-db"
database_id = "9e560592-ec8e-451d-97d3-c2d8082c527e"   # npx wrangler d1 create vane-db

# Image uploads (POST /api/media/upload). The bucket must exist BEFORE the next deploy:
#   npx wrangler r2 bucket create vane-media
# (a binding to a missing bucket makes the deployment fail; the previous deployment stays live)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vane-media"

# Workers AI: the AI tools in the post editor (hashtags, Make it clean, Smart Re-formatter, Post Generator, Tone, Hook & CTA).
# Nothing to create: the binding is enough. Without it those buttons answer "AI is not enabled on this server".
[ai]
binding = "AI"

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFYNiz-h1o5Y-W8u"
# Sender of the emailed 6-digit codes: a domain verified in Resend. A plain value, so it lives HERE (not in the
# Pages dashboard, and not in worker/wrangler.toml: the cron worker sends no email). RESEND_API_KEY is a Pages secret.
EMAIL_FROM = "Vane <noreply@vaneapp.dev>"
