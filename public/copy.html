<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy your code — Vane</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#070708" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/vane.css?v=aa1317ecc8" />
  <link rel="stylesheet" href="/assets/app.css?v=8c32755594" />
</head>

<body class="min-h-screen overflow-x-hidden bg-[#070708]">
  <div class="fixed inset-0 bg-gradient-to-b from-white/[0.04] via-transparent to-transparent" aria-hidden="true"></div>

  <div class="relative z-10 flex min-h-screen flex-col">
    <header class="flex items-center justify-between px-5 py-5 sm:px-8 sm:py-6 lg:px-12">
      <a href="/" id="home" class="text-lg font-semibold" aria-label="Vane home">vane</a>
    </header>

    <main class="mx-auto flex w-full max-w-md flex-1 items-center px-5 pb-16 sm:px-8">
      <div class="glass-d-strong w-full rounded-[1.75rem] p-6 text-center shadow-2xl sm:p-8">
        <!-- the code is in the URL fragment: copy.js reads it, then clears it from the address bar -->
        <div id="viewCode" class="hidden">
          <h1 class="text-2xl font-semibold tracking-tight">Your sign-in code</h1>
          <p class="mt-1.5 text-sm text-white/55">Copy it, then paste it on the Vane sign-in page.</p>
          <div id="codeBox" class="pixel mt-6 select-all rounded-2xl border border-white/10 bg-black/40 py-5 text-[2rem] tracking-[.35em] pl-[.35em]" aria-live="polite"></div>
          <button id="copyBtn" type="button" class="btn btn-white mt-5 w-full !py-3">
            <span id="copyLabel">Copy code</span>
          </button>
          <p id="copyNote" class="mt-4 min-h-[1.25rem] text-xs leading-relaxed text-white/45" role="status"></p>
        </div>

        <div id="viewBad" class="hidden">
          <h1 class="text-2xl font-semibold tracking-tight">This link doesn’t work</h1>
          <p class="mt-1.5 text-sm leading-relaxed text-white/55">It has no code in it. Open the newest email from Vane, or ask for a new code on the sign-in page.</p>
          <a href="/login" class="btn btn-white mt-6 w-full !py-3">Go to sign in</a>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/copy.js?v=00d9235dca"></script>
</body>
</html>
